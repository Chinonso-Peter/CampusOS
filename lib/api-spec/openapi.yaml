openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: campusos
    description: CampusOS student wellbeing and planning operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create an account
      description: Registers a new student and starts a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Created account and session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "204":
          description: Logged out
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get the signed-in user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
  /dashboard:
    get:
      operationId: getDashboard
      tags: [campusos]
      summary: Get the unified student dashboard
      responses:
        "200":
          description: Dashboard snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /profile:
    get:
      operationId: getProfile
      tags: [campusos]
      summary: Get the signed-in student's profile
      responses:
        "200":
          description: Student profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
    patch:
      operationId: updateProfile
      tags: [campusos]
      summary: Update the signed-in student's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated student profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
  /signals:
    get:
      operationId: getSignals
      tags: [campusos]
      summary: Get actionable cross-domain signals
      responses:
        "200":
          description: Signals feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Signal"
  /mood-checkins:
    get:
      operationId: getMoodCheckIns
      tags: [campusos]
      summary: List recent mood check-ins
      responses:
        "200":
          description: Mood check-ins
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MoodCheckIn"
    post:
      operationId: createMoodCheckIn
      tags: [campusos]
      summary: Record a mood check-in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoodCheckInInput"
      responses:
        "201":
          description: Created mood check-in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoodCheckIn"
  /assignments:
    get:
      operationId: getAssignments
      tags: [campusos]
      summary: List assignments
      responses:
        "200":
          description: Assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Assignment"
    post:
      operationId: createAssignment
      tags: [campusos]
      summary: Create an assignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentInput"
      responses:
        "201":
          description: Created assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
  /finance-events:
    get:
      operationId: getFinanceEvents
      tags: [campusos]
      summary: List finance events
      responses:
        "200":
          description: Finance events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FinanceEvent"
    post:
      operationId: createFinanceEvent
      tags: [campusos]
      summary: Create a finance event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceEventInput"
      responses:
        "201":
          description: Created finance event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceEvent"
  /work-hours:
    get:
      operationId: getWorkHours
      tags: [campusos]
      summary: List weekly work hours
      responses:
        "200":
          description: Work hours
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkHours"
  /sleep-logs:
    get:
      operationId: getSleepLogs
      tags: [campusos]
      summary: List recent sleep logs
      responses:
        "200":
          description: Sleep logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SleepLog"
  /scholarships:
    get:
      operationId: getScholarships
      tags: [campusos]
      summary: Match and list relevant scholarships
      responses:
        "200":
          description: Matched scholarships
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Scholarship"
  /money/stress-impact:
    get:
      operationId: getStressImpact
      tags: [campusos]
      summary: Mood-money stress correlation
      responses:
        "200":
          description: Stress impact analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StressImpact"
  /grind/workload:
    get:
      operationId: getWorkload
      tags: [campusos]
      summary: Semester workload visualization data
      responses:
        "200":
          description: Weekly workload breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkloadWeek"
  /grind/conflicts:
    get:
      operationId: getConflicts
      tags: [campusos]
      summary: Detect deadline conflicts
      responses:
        "200":
          description: Detected conflicts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeadlineConflict"
  /grind/study-plan:
    get:
      operationId: getStudyPlan
      tags: [campusos]
      summary: AI-adjusted study plan based on energy levels
      responses:
        "200":
          description: Personalised study plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyPlan"
  /grind/timetable:
    get:
      operationId: getTimetable
      tags: [campusos]
      summary: Personal study timetable
      responses:
        "200":
          description: Timetable blocks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudyBlock"
    post:
      operationId: updateTimetable
      tags: [campusos]
      summary: Replace the personal study timetable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimetableInput"
      responses:
        "200":
          description: Updated timetable
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudyBlock"
  /chat:
    post:
      operationId: sendChatMessage
      tags: [campusos]
      summary: Send a supportive chat message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatInput"
      responses:
        "200":
          description: Supportive response or crisis escalation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    User:
      type: object
      required: [id, name, email, school, program, year]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email, minLength: 1 }
        school: { type: string }
        program: { type: string }
        year: { type: string }
    RegisterInput:
      type: object
      required: [name, email, password, school, program, year]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, format: email, minLength: 1 }
        password: { type: string, minLength: 6 }
        school: { type: string, minLength: 1 }
        program: { type: string, minLength: 1 }
        year: { type: string, minLength: 1 }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, minLength: 1 }
        password: { type: string, minLength: 1 }
    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
    ErrorBody:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Profile:
      type: object
      required: [name, school, program, year]
      properties:
        name: { type: string, minLength: 1 }
        school: { type: string, minLength: 1 }
        program: { type: string, minLength: 1 }
        year: { type: string, minLength: 1 }
    ProfileUpdate:
      type: object
      required: [name, school, program, year]
      properties:
        name: { type: string, minLength: 1 }
        school: { type: string, minLength: 1 }
        program: { type: string, minLength: 1 }
        year: { type: string, minLength: 1 }
    MoodCheckIn:
      type: object
      required: [id, date, moodScore]
      properties:
        id: { type: integer }
        date: { type: string }
        moodScore: { type: integer, minimum: 1, maximum: 5 }
        note: { type: ["string", "null"] }
    MoodCheckInInput:
      type: object
      required: [moodScore]
      properties:
        moodScore: { type: integer, minimum: 1, maximum: 5 }
        note: { type: string }
    Assignment:
      type: object
      required: [id, title, course, dueDate, status, priority]
      properties:
        id: { type: integer }
        title: { type: string }
        course: { type: string }
        dueDate: { type: string }
        status: { type: string, enum: [pending, late, submitted] }
        priority: { type: string, enum: [low, medium, high] }
    AssignmentInput:
      type: object
      required: [title, course, dueDate]
      properties:
        title: { type: string }
        course: { type: string }
        dueDate: { type: string }
        priority: { type: string, enum: [low, medium, high] }
    FinanceEvent:
      type: object
      required: [id, type, label, date, amount, category]
      properties:
        id: { type: integer }
        type: { type: string, enum: [deadline, expense, income] }
        label: { type: string }
        date: { type: string }
        amount: { type: ["number", "null"] }
        category: { type: string }
    FinanceEventInput:
      type: object
      required: [type, label, date, category]
      properties:
        type: { type: string, enum: [deadline, expense, income] }
        label: { type: string }
        date: { type: string }
        amount: { type: number }
        category: { type: string }
    WorkHours:
      type: object
      required: [id, week, hoursWorked]
      properties:
        id: { type: integer }
        week: { type: string }
        hoursWorked: { type: number }
    SleepLog:
      type: object
      required: [id, date, hoursSlept]
      properties:
        id: { type: integer }
        date: { type: string }
        hoursSlept: { type: number }
    Signal:
      type: object
      required: [id, category, title, description, action, severity, createdAt]
      properties:
        id: { type: integer }
        category: { type: string, enum: [mind, money, grind] }
        title: { type: string }
        description: { type: string }
        action: { type: string }
        severity: { type: string, enum: [watch, attention, urgent] }
        createdAt: { type: string }
    PillarSummary:
      type: object
      required: [label, value, detail, tone]
      properties:
        label: { type: string }
        value: { type: string }
        detail: { type: string }
        tone: { type: string, enum: [mind, money, grind] }
    Dashboard:
      type: object
      required: [user, greeting, patternInsight, pillars, assignments, signals, mood]
      properties:
        user: { $ref: "#/components/schemas/User" }
        greeting: { type: string }
        patternInsight: { type: string }
        pillars:
          type: array
          items: { $ref: "#/components/schemas/PillarSummary" }
        assignments:
          type: array
          items: { $ref: "#/components/schemas/Assignment" }
        signals:
          type: array
          items: { $ref: "#/components/schemas/Signal" }
        mood:
          type: array
          items: { $ref: "#/components/schemas/MoodCheckIn" }
    ChatInput:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1 }
    ChatResponse:
      type: object
      required: [message, crisis]
      properties:
        message: { type: string }
        crisis: { type: boolean }
        resource: { type: ["string", "null"] }
        suggestions:
          type: array
          items: { type: string }
        intent: { type: string, nullable: true }
    Scholarship:
      type: object
      required: [id, name, provider, deadline, amount, category, eligible, matchScore]
      properties:
        id: { type: integer }
        name: { type: string }
        provider: { type: string }
        deadline: { type: string }
        amount: { type: integer }
        category: { type: string }
        eligible: { type: boolean }
        matchScore: { type: integer, minimum: 0, maximum: 100 }
        matchReason: { type: string }
    StressImpact:
      type: object
      required: [periods, overallCorrelation, insight, recommendation]
      properties:
        periods:
          type: array
          items:
            type: object
            required: [label, moodAvg, moneyStress]
            properties:
              label: { type: string }
              moodAvg: { type: number }
              moneyStress: { type: number }
        overallCorrelation: { type: number }
        insight: { type: string }
        recommendation: { type: string }
    WorkloadWeek:
      type: object
      required: [week, assignments, highPriorityCount, intensity]
      properties:
        week: { type: string }
        assignments:
          type: array
          items: { $ref: "#/components/schemas/Assignment" }
        highPriorityCount: { type: integer }
        intensity: { type: string, enum: [light, moderate, heavy, critical] }
    DeadlineConflict:
      type: object
      required: [assignments, message, severity, suggestion]
      properties:
        assignments:
          type: array
          items: { $ref: "#/components/schemas/Assignment" }
        message: { type: string }
        severity: { type: string, enum: [low, medium, high] }
        suggestion: { type: string }
    StudyBlock:
      type: object
      required: [id, day, startHour, endHour, activity, energyFit]
      properties:
        id: { type: integer }
        day: { type: string }
        startHour: { type: integer }
        endHour: { type: integer }
        activity: { type: string }
        energyFit: { type: string, enum: [high, medium, low] }
    StudyPlan:
      type: object
      required: [blocks, summary, energyBasedTip]
      properties:
        blocks:
          type: array
          items: { $ref: "#/components/schemas/StudyBlock" }
        summary: { type: string }
        energyBasedTip: { type: string }
    TimetableInput:
      type: object
      required: [blocks]
      properties:
        blocks:
          type: array
          items:
            type: object
            required: [day, startHour, endHour, activity]
            properties:
              day: { type: string }
              startHour: { type: integer }
              endHour: { type: integer }
              activity: { type: string }

